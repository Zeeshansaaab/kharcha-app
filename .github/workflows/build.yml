name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK; this just puts it on PATH
      # and accepts the licences non-interactively.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # Download this from the run's Artifacts section, then sideload it.
      # Debug builds are signed with the standard debug key, which is fine
      # for your own device and useless for distribution.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kharcha-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Compile errors are the expected failure mode on a first run.
      # This keeps the full Gradle report so you can read what broke.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/
